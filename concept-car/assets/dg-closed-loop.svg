<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="Closed-loop signal flow: desired distance minus measured distance gives error, a PID controller produces velocity v, convToWheelVel turns v and w into left and right wheel speeds, and wheel encoders close the loop">
<style>
  /* Burgundy + gold, taken verbatim from site/style.css, which in turn follows
     brand/README.md. Light mode leads with the wine red; dark mode leads with
     the gold, because a #5A1322 line is invisible on a near-black field - the
     same split the avatar uses. */
  .bg    { fill: #fbf8f7; }                                    /* --bg */
  .panel { fill: #ffffff; stroke: #e6dcdd; stroke-width: 1.5; }   /* --panel / --line */
  .band  { fill: #f4efee; }                                    /* --accent-soft */
  .edge  { stroke: #8a7d80; stroke-width: 1.5; fill: none; }   /* --ink-3 */
  .dash  { stroke: #8a7d80; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
  .t     { fill: #1a1214; font-family: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif; }
  .m     { fill: #55494c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .dim   { fill: #8a7d80; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .acc   { fill: #5A1322; }                                    /* --accent */
  .accs  { stroke: #5A1322; }
  .ok    { fill: #2f6f4e; }
  .ser1  { stroke: #5A1322; }                                  /* primary series */
  .ser2  { stroke: #8a6718; }                                  /* gold, darkened for cream */
  .grid  { stroke: #e6dcdd; }
  .axis  { stroke: #8a7d80; stroke-width: 1.4; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #120A10; }
    .panel { fill: #1d151a; stroke: #33232a; }
    .band  { fill: #3C0B16; }
    .edge, .dash { stroke: #8a7d82; }
    .t     { fill: #F4EFEE; }
    .m     { fill: #b9aeb1; }
    .dim   { fill: #8a7d82; }
    .acc   { fill: #C9A24A; }
    .accs  { stroke: #C9A24A; }
    .ok    { fill: #74c49a; }
    .ser1  { stroke: #C9A24A; }
    .ser2  { stroke: #d98a80; }
    .grid  { stroke: #33232a; }
    .axis  { stroke: #8a7d82; }
  }
</style>
<rect class="bg" width="940" height="360"/><defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker></defs><text x="40" y="36" class="t" font-size="16" text-anchor="start" font-weight="600">Closed-loop control - signal flow</text><text x="40" y="56" class="dim" font-size="11" text-anchor="start" font-weight="normal">Block names are the model's own. Redrawn from the Simulink diagram for legibility.</text><rect class="panel" x="40" y="128" width="130" height="56" rx="7"/><text x="105.0" y="152.0" class="t" font-size="12" text-anchor="middle" font-weight="600">desired</text><text x="105.0" y="170.0" class="dim" font-size="10" text-anchor="middle" font-weight="normal">commanded distance</text><circle cx="238" cy="156" r="20" class="panel"/><text x="238" y="162" class="acc" font-size="17" text-anchor="middle" font-weight="bold">−</text><text x="238" y="116" class="dim" font-size="10" text-anchor="middle" font-weight="normal">error</text><rect class="panel" x="300" y="128" width="130" height="56" rx="7"/><rect class="band" x="301" y="129" width="128" height="20" rx="6"/><text x="365.0" y="152.0" class="t" font-size="12" text-anchor="middle" font-weight="600">PID</text><text x="365.0" y="170.0" class="dim" font-size="10" text-anchor="middle" font-weight="normal">P(z)</text><rect class="panel" x="500" y="128" width="170" height="56" rx="7"/><text x="585.0" y="152.0" class="t" font-size="12" text-anchor="middle" font-weight="600">convToWheelVel</text><text x="585.0" y="170.0" class="dim" font-size="10" text-anchor="middle" font-weight="normal">v, w to wl, wr</text><rect class="panel" x="760" y="74" width="140" height="52" rx="7"/><text x="830.0" y="96.0" class="t" font-size="12" text-anchor="middle" font-weight="600">LeftMotor</text><text x="830.0" y="114.0" class="dim" font-size="10" text-anchor="middle" font-weight="normal">wl (deg/s)</text><rect class="panel" x="760" y="186" width="140" height="52" rx="7"/><text x="830.0" y="208.0" class="t" font-size="12" text-anchor="middle" font-weight="600">RightMotor</text><text x="830.0" y="226.0" class="dim" font-size="10" text-anchor="middle" font-weight="normal">wr (deg/s)</text><line class="accs" x1="170" y1="156" x2="216" y2="156" stroke-width="2" marker-end="url(#ar2)"/><line class="accs" x1="260" y1="156" x2="296" y2="156" stroke-width="2" marker-end="url(#ar2)"/><line class="accs" x1="430" y1="156" x2="496" y2="156" stroke-width="2" marker-end="url(#ar2)"/><text x="462" y="148" class="acc" font-size="11" text-anchor="middle" font-weight="normal">v</text><path class="accs" d="M 670,144 L 715,144 L 715,100 L 756,100" fill="none" stroke-width="2" marker-end="url(#ar2)"/><path class="accs" d="M 670,168 L 715,168 L 715,212 L 756,212" fill="none" stroke-width="2" marker-end="url(#ar2)"/><rect class="panel" x="500" y="224" width="170" height="40" rx="7"/><text x="585" y="249" class="m" font-size="11" text-anchor="middle" font-weight="normal">w = 0 while driving</text><line class="accs" x1="585" y1="224" x2="585" y2="186" stroke-width="2" marker-end="url(#ar2)"/><path class="edge" d="M 900,238 L 916,238 L 916,318 L 238,318 L 238,178" fill="none" marker-end="url(#ar2)" stroke-dasharray="6 4" stroke-width="1.6"/><text x="560" y="312" class="dim" font-size="11" text-anchor="middle" font-weight="normal">measured distance - wheel encoders, the only feedback</text></svg>