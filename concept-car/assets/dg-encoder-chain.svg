<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Encoder feedback chain: wheel speed in degrees per second is integrated by a discrete-time integrator to give accumulated degrees">
<style>
  /* Burgundy + gold, taken verbatim from site/style.css, which in turn follows
     brand/README.md. Light mode leads with the wine red; dark mode leads with
     the gold, because a #5A1322 line is invisible on a near-black field - the
     same split the avatar uses. */
  .bg    { fill: #fbf8f7; }                                    /* --bg */
  .panel { fill: #ffffff; stroke: #e6dcdd; stroke-width: 1.5; }   /* --panel / --line */
  .band  { fill: #f4efee; }                                    /* --accent-soft */
  .edge  { stroke: #8a7d80; stroke-width: 1.5; fill: none; }   /* --ink-3 */
  .dash  { stroke: #8a7d80; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
  .t     { fill: #1a1214; font-family: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif; }
  .m     { fill: #55494c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .dim   { fill: #8a7d80; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .acc   { fill: #5A1322; }                                    /* --accent */
  .accs  { stroke: #5A1322; }
  .ok    { fill: #2f6f4e; }
  .ser1  { stroke: #5A1322; }                                  /* primary series */
  .ser2  { stroke: #8a6718; }                                  /* gold, darkened for cream */
  .grid  { stroke: #e6dcdd; }
  .axis  { stroke: #8a7d80; stroke-width: 1.4; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #120A10; }
    .panel { fill: #1d151a; stroke: #33232a; }
    .band  { fill: #3C0B16; }
    .edge, .dash { stroke: #8a7d82; }
    .t     { fill: #F4EFEE; }
    .m     { fill: #b9aeb1; }
    .dim   { fill: #8a7d82; }
    .acc   { fill: #C9A24A; }
    .accs  { stroke: #C9A24A; }
    .ok    { fill: #74c49a; }
    .ser1  { stroke: #C9A24A; }
    .ser2  { stroke: #d98a80; }
    .grid  { stroke: #33232a; }
    .axis  { stroke: #8a7d82; }
  }
</style>
<rect class="bg" width="760" height="300"/><defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker></defs><text x="40" y="36" class="t" font-size="16" text-anchor="start" font-weight="600">Encoder feedback chain</text><text x="40" y="56" class="dim" font-size="11" text-anchor="start" font-weight="normal">Wheel rotation is integrated to an angle. Nothing here measures position.</text><rect class="panel" x="40" y="120" width="190" height="72" rx="7"/><rect class="band" x="41" y="121" width="188" height="26" rx="6"/><circle cx="58" cy="134" r="8" fill="none" class="accs" stroke-width="1.6"/><text x="58" y="138" class="acc" font-size="10" text-anchor="middle" font-weight="bold">C</text><text x="74" y="139" class="t" font-size="12" text-anchor="start" font-weight="600">WheelSpeed</text><text x="135.0" y="172" class="m" font-size="10" text-anchor="middle" font-weight="normal">deg/s from the encoder</text><rect class="panel" x="280" y="120" width="190" height="72" rx="7"/><rect class="band" x="281" y="121" width="188" height="26" rx="6"/><circle cx="298" cy="134" r="8" fill="none" class="accs" stroke-width="1.6"/><text x="298" y="138" class="acc" font-size="10" text-anchor="middle" font-weight="bold">C</text><text x="314" y="139" class="t" font-size="12" text-anchor="start" font-weight="600">DiscreteTimeIntegrator</text><text x="375.0" y="172" class="m" font-size="10" text-anchor="middle" font-weight="normal">integrate(input)</text><rect class="panel" x="540" y="120" width="190" height="72" rx="7"/><rect class="band" x="541" y="121" width="188" height="26" rx="6"/><circle cx="558" cy="134" r="8" fill="none" class="accs" stroke-width="1.6"/><text x="558" y="138" class="acc" font-size="10" text-anchor="middle" font-weight="bold">C</text><text x="574" y="139" class="t" font-size="12" text-anchor="start" font-weight="600">Degrees</text><text x="635.0" y="172" class="m" font-size="10" text-anchor="middle" font-weight="normal">accumulated angle</text><line class="accs" x1="230" y1="156" x2="280" y2="156" stroke-width="2" marker-end="url(#ar3)"/><line class="accs" x1="470" y1="156" x2="520" y2="156" stroke-width="2" marker-end="url(#ar3)"/><text x="255" y="146" class="dim" font-size="10" text-anchor="middle" font-weight="normal">input</text><text x="495" y="146" class="dim" font-size="10" text-anchor="middle" font-weight="normal">output</text><rect class="panel" x="40" y="226" width="690" height="46" rx="7"/><text x="60" y="254" class="dim" font-size="11" text-anchor="start" font-weight="normal">Integrating rotation gives heading, not location - which is why drift accumulates unnoticed.</text></svg>