"8" fill="none" class="accs" stroke-width="1.6"/><text x="388" y="450" class="acc" font-size="10" text-anchor="middle" font-weight="bold">C</text><text x="404" y="451" class="t" font-size="13" text-anchor="start" font-weight="600">ActuatorManager</text><line class="edge" x1="370" y1="462" x2="620" y2="462"/><text x="384" y="480" class="m" font-size="11" text-anchor="start" font-weight="normal">+ActuatorManager(Serial)</text><rect class="panel" x="700" y="430" width="290" height="80" rx="6"/><rect class="band" x="701" y="431" width="288" height="31" rx="5"/><circle cx="718" cy="446" r="8" fill="none" class="accs" stroke-width="1.6"/><text x="718" y="450" class="acc" font-size="10" text-anchor="middle" font-weight="bold">C</text><text x="734" y="451" class="t" font-size="13" text-anchor="start" font-weight="600">DCMotor</text><line class="edge" x1="700" y1="462" x2="990" y2="462"/><text x="714" y="480" class="m" font-size="11" text-anchor="start" font-weight="normal">+DCMotor(id, mgr: ActuatorManager)</text><text x="714" y="498" class="m" font-size="11" text-anchor="start" font-weight="normal">+setVoltage(int16_t)</text><circle cx="620" cy="150" r="9" class="panel"/><text x="620" y="132" class="dim" font-size="11" text-anchor="middle" font-weight="normal">«interface» Sensor1</text><path class="edge" d="M 612,157 L 470,250"/><path class="edge" d="M 629,157 L 760,250"/><path class="edge" d="M 400,192 L 360,250"/><path class="edge" d="M 250,322 L 190,430"/><path class="edge" d="M 400,322 L 470,430"/><path class="edge" d="M 830,322 L 840,430"/><text x="30" y="668" class="dim" font-size="11" text-anchor="start" font-weight="normal">T — encoder count type, templated in the library header</text></svg>