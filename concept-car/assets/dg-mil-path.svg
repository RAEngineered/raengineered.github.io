<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" role="img" aria-label="Simulated model-in-the-loop path: a closed 30 by 30 cm square, tracked exactly">
<style>
  /* Burgundy + gold, taken verbatim from site/style.css, which in turn follows
     brand/README.md. Light mode leads with the wine red; dark mode leads with
     the gold, because a #5A1322 line is invisible on a near-black field - the
     same split the avatar uses. */
  .bg    { fill: #fbf8f7; }                                    /* --bg */
  .panel { fill: #ffffff; stroke: #e6dcdd; stroke-width: 1.5; }   /* --panel / --line */
  .band  { fill: #f4efee; }                                    /* --accent-soft */
  .edge  { stroke: #8a7d80; stroke-width: 1.5; fill: none; }   /* --ink-3 */
  .dash  { stroke: #8a7d80; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
  .t     { fill: #1a1214; font-family: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif; }
  .m     { fill: #55494c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .dim   { fill: #8a7d80; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .acc   { fill: #5A1322; }                                    /* --accent */
  .accs  { stroke: #5A1322; }
  .ok    { fill: #2f6f4e; }
  .ser1  { stroke: #5A1322; }                                  /* primary series */
  .ser2  { stroke: #8a6718; }                                  /* gold, darkened for cream */
  .grid  { stroke: #e6dcdd; }
  .axis  { stroke: #8a7d80; stroke-width: 1.4; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #120A10; }
    .panel { fill: #1d151a; stroke: #33232a; }
    .band  { fill: #3C0B16; }
    .edge, .dash { stroke: #8a7d82; }
    .t     { fill: #F4EFEE; }
    .m     { fill: #b9aeb1; }
    .dim   { fill: #8a7d82; }
    .acc   { fill: #C9A24A; }
    .accs  { stroke: #C9A24A; }
    .ok    { fill: #74c49a; }
    .ser1  { stroke: #C9A24A; }
    .ser2  { stroke: #d98a80; }
    .grid  { stroke: #33232a; }
    .axis  { stroke: #8a7d82; }
  }
</style>
<rect class="bg" width="700" height="620"/><text x="40" y="40" class="t" font-size="17" text-anchor="start" font-weight="600">Simulated path — model-in-the-loop</text><text x="40" y="62" class="dim" font-size="12" text-anchor="start" font-weight="normal">Digitised from the original plot. The simulated vehicle closes the square exactly.</text><line class="grid" x1="96" y1="435.4" x2="616" y2="435.4"/><text x="82" y="440.3684210526316" class="dim" font-size="13" text-anchor="end" font-weight="normal">0</text><line class="grid" x1="96" y1="330.1" x2="616" y2="330.1"/><text x="82" y="335.10526315789474" class="dim" font-size="13" text-anchor="end" font-weight="normal">10</text><line class="grid" x1="96" y1="224.8" x2="616" y2="224.8"/><text x="82" y="229.8421052631579" class="dim" font-size="13" text-anchor="end" font-weight="normal">20</text><line class="grid" x1="96" y1="119.6" x2="616" y2="119.6"/><text x="82" y="124.57894736842105" class="dim" font-size="13" text-anchor="end" font-weight="normal">30</text><line class="grid" x1="137.1" y1="88" x2="137.1" y2="488"/><text x="137.05263157894737" y="514" class="dim" font-size="13" text-anchor="middle" font-weight="normal">0</text><line class="grid" x1="273.9" y1="88" x2="273.9" y2="488"/><text x="273.89473684210526" y="514" class="dim" font-size="13" text-anchor="middle" font-weight="normal">10</text><line class="grid" x1="410.7" y1="88" x2="410.7" y2="488"/><text x="410.7368421052632" y="514" class="dim" font-size="13" text-anchor="middle" font-weight="normal">20</text><line class="grid" x1="547.6" y1="88" x2="547.6" y2="488"/><text x="547.578947368421" y="514" class="dim" font-size="13" text-anchor="middle" font-weight="normal">30</text><rect x="96" y="88" width="520" height="400" fill="none" class="axis"/><text x="356.0" y="544" class="m" font-size="14" text-anchor="middle" font-weight="normal">x (cm)</text><g transform="translate(26,288.0) rotate(-90)"><text x="0" y="0" class="m" font-size="14" text-anchor="middle" font-weight="normal">y (cm)</text></g><path d="M 137.1,435.4 L 547.6,435.4 L 547.6,119.6 L 137.1,119.6 L 137.1,435.4" class="ser1" fill="none" stroke-width="3" stroke-dasharray="6 4" stroke-linejoin="round"/><circle cx="137.1" cy="435.4" r="4.5" class="acc"/><circle cx="547.6" cy="435.4" r="4.5" class="acc"/><circle cx="547.6" cy="119.6" r="4.5" class="acc"/><circle cx="137.1" cy="119.6" r="4.5" class="acc"/><circle cx="137.1" cy="435.4" r="8" fill="none" class="ser2" stroke-width="2.5"/><text x="151.05263157894737" y="457.3684210526316" class="m" font-size="13" text-anchor="start" font-weight="normal">start / finish</text><rect class="panel" x="370" y="300" width="230" height="44" rx="7"/><line x1="386" y1="325" x2="420" y2="325" class="ser1" stroke-width="3.4" stroke-dasharray="7 4"/><text x="432" y="330" class="m" font-size="15" text-anchor="start" font-weight="normal">simulated path</text><text x="40" y="602" class="dim" font-size="12" text-anchor="start" font-weight="normal">Every ink pixel in the original sits on one of the four commanded edges — zero deviation.</text></svg>