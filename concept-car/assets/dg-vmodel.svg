<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-label="V-model: requirements, system design, architecture, functional design and implementation descending the left arm; model-in-the-loop, processor-in-the-loop, run-on-board and the verification table ascending the right">
<style>
  /* Burgundy + gold, taken verbatim from site/style.css, which in turn follows
     brand/README.md. Light mode leads with the wine red; dark mode leads with
     the gold, because a #5A1322 line is invisible on a near-black field - the
     same split the avatar uses. */
  .bg    { fill: #fbf8f7; }                                    /* --bg */
  .panel { fill: #ffffff; stroke: #e6dcdd; stroke-width: 1.5; }   /* --panel / --line */
  .band  { fill: #f4efee; }                                    /* --accent-soft */
  .edge  { stroke: #8a7d80; stroke-width: 1.5; fill: none; }   /* --ink-3 */
  .dash  { stroke: #8a7d80; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
  .t     { fill: #1a1214; font-family: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif; }
  .m     { fill: #55494c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .dim   { fill: #8a7d80; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .acc   { fill: #5A1322; }                                    /* --accent */
  .accs  { stroke: #5A1322; }
  .ok    { fill: #2f6f4e; }
  .ser1  { stroke: #5A1322; }                                  /* primary series */
  .ser2  { stroke: #8a6718; }                                  /* gold, darkened for cream */
  .grid  { stroke: #e6dcdd; }
  .axis  { stroke: #8a7d80; stroke-width: 1.4; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #120A10; }
    .panel { fill: #1d151a; stroke: #33232a; }
    .band  { fill: #3C0B16; }
    .edge, .dash { stroke: #8a7d82; }
    .t     { fill: #F4EFEE; }
    .m     { fill: #b9aeb1; }
    .dim   { fill: #8a7d82; }
    .acc   { fill: #C9A24A; }
    .accs  { stroke: #C9A24A; }
    .ok    { fill: #74c49a; }
    .ser1  { stroke: #C9A24A; }
    .ser2  { stroke: #d98a80; }
    .grid  { stroke: #33232a; }
    .axis  { stroke: #8a7d82; }
  }
</style>
<rect class="bg" width="900" height="510"/><text x="40" y="34" class="t" font-size="16" text-anchor="start" font-weight="600">The V - decomposition against verification</text><text x="40" y="54" class="dim" font-size="11" text-anchor="start" font-weight="normal">Each right-hand activity verifies the left-hand one at the same height, and was planned first.</text><path class="edge" d="M 110,134 L 420,474 L 730,134" stroke-width="2"/><rect class="panel" x="20" y="82" width="158" height="34" rx="7"/><text x="32" y="104" class="acc" font-size="10" text-anchor="start" font-weight="bold">REQ</text><text x="74" y="104" class="t" font-size="11.5" text-anchor="start" font-weight="normal">Requirements</text><rect class="panel" x="100" y="168" width="158" height="34" rx="7"/><text x="112" y="190" class="acc" font-size="10" text-anchor="start" font-weight="bold">SYS</text><text x="154" y="190" class="t" font-size="11.5" text-anchor="start" font-weight="normal">System design</text><rect class="panel" x="180" y="254" width="158" height="34" rx="7"/><text x="192" y="276" class="acc" font-size="10" text-anchor="start" font-weight="bold">ARCH</text><text x="234" y="276" class="t" font-size="11.5" text-anchor="start" font-weight="normal">Architecture</text><rect class="panel" x="260" y="340" width="158" height="34" rx="7"/><text x="272" y="362" class="acc" font-size="10" text-anchor="start" font-weight="bold">FUNC</text><text x="314" y="362" class="t" font-size="11.5" text-anchor="start" font-weight="normal">Functional design</text><rect class="panel" x="340" y="426" width="158" height="34" rx="7"/><text x="352" y="448" class="acc" font-size="10" text-anchor="start" font-weight="bold">IMPL</text><text x="394" y="448" class="t" font-size="11.5" text-anchor="start" font-weight="normal">Implementation</text><rect class="panel" x="500" y="340" width="158" height="34" rx="7"/><text x="512" y="362" class="acc" font-size="10" text-anchor="start" font-weight="bold">MIL</text><text x="554" y="362" class="t" font-size="11.5" text-anchor="start" font-weight="normal">Model-in-the-loop</text><rect class="panel" x="580" y="254" width="158" height="34" rx="7"/><text x="592" y="276" class="acc" font-size="10" text-anchor="start" font-weight="bold">PIL</text><text x="634" y="276" class="t" font-size="11.5" text-anchor="start" font-weight="normal">Processor-in-the-loop</text><rect class="panel" x="660" y="168" width="158" height="34" rx="7"/><text x="672" y="190" class="acc" font-size="10" text-anchor="start" font-weight="bold">ROB</text><text x="714" y="190" class="t" font-size="11.5" text-anchor="start" font-weight="normal">Run-on-board</text><rect class="panel" x="740" y="82" width="158" height="34" rx="7"/><text x="752" y="104" class="acc" font-size="10" text-anchor="start" font-weight="bold">VER</text><text x="794" y="104" class="t" font-size="11.5" text-anchor="start" font-weight="normal">Verification table</text><line class="dash" x1="178" y1="99" x2="740" y2="99"/><line class="dash" x1="258" y1="185" x2="660" y2="185"/><line class="dash" x1="338" y1="271" x2="580" y2="271"/><line class="dash" x1="418" y1="357" x2="500" y2="357"/><text x="150" y="496" class="dim" font-size="11" text-anchor="start" font-weight="normal">decomposition ↓</text><text x="640" y="496" class="dim" font-size="11" text-anchor="start" font-weight="normal">↑ verification</text></svg>