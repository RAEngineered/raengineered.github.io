<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="I2C bus topology: VDD, SDA and SCL lines with pull-up resistors, connecting the Nano 33 IoT as master to the motor carrier and encoders as slaves">
<style>
  /* Burgundy + gold, taken verbatim from site/style.css, which in turn follows
     brand/README.md. Light mode leads with the wine red; dark mode leads with
     the gold, because a #5A1322 line is invisible on a near-black field - the
     same split the avatar uses. */
  .bg    { fill: #fbf8f7; }                                    /* --bg */
  .panel { fill: #ffffff; stroke: #e6dcdd; stroke-width: 1.5; }   /* --panel / --line */
  .band  { fill: #f4efee; }                                    /* --accent-soft */
  .edge  { stroke: #8a7d80; stroke-width: 1.5; fill: none; }   /* --ink-3 */
  .dash  { stroke: #8a7d80; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
  .t     { fill: #1a1214; font-family: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif; }
  .m     { fill: #55494c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .dim   { fill: #8a7d80; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .acc   { fill: #5A1322; }                                    /* --accent */
  .accs  { stroke: #5A1322; }
  .ok    { fill: #2f6f4e; }
  .ser1  { stroke: #5A1322; }                                  /* primary series */
  .ser2  { stroke: #8a6718; }                                  /* gold, darkened for cream */
  .grid  { stroke: #e6dcdd; }
  .axis  { stroke: #8a7d80; stroke-width: 1.4; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #120A10; }
    .panel { fill: #1d151a; stroke: #33232a; }
    .band  { fill: #3C0B16; }
    .edge, .dash { stroke: #8a7d82; }
    .t     { fill: #F4EFEE; }
    .m     { fill: #b9aeb1; }
    .dim   { fill: #8a7d82; }
    .acc   { fill: #C9A24A; }
    .accs  { stroke: #C9A24A; }
    .ok    { fill: #74c49a; }
    .ser1  { stroke: #C9A24A; }
    .ser2  { stroke: #d98a80; }
    .grid  { stroke: #33232a; }
    .axis  { stroke: #8a7d82; }
  }
</style>
<rect class="bg" width="820" height="340"/><text x="40" y="36" class="t" font-size="16" text-anchor="start" font-weight="600">I²C bus - controller to motor carrier</text><text x="40" y="56" class="dim" font-size="11" text-anchor="start" font-weight="normal">Two wires, pulled high, shared by every device on the bus.</text><line class="edge" x1="70" y1="104" x2="700" y2="104" stroke-width="2"/><rect class="panel" x="706" y="88" width="74" height="32" rx="6"/><text x="743" y="109" class="m" font-size="12" text-anchor="middle" font-weight="600">VDD</text><line class="edge" x1="70" y1="150" x2="700" y2="150" stroke-width="2"/><rect class="panel" x="706" y="134" width="74" height="32" rx="6"/><text x="743" y="155" class="m" font-size="12" text-anchor="middle" font-weight="600">SDA</text><line class="edge" x1="70" y1="196" x2="700" y2="196" stroke-width="2"/><rect class="panel" x="706" y="180" width="74" height="32" rx="6"/><text x="743" y="201" class="m" font-size="12" text-anchor="middle" font-weight="600">SCL</text><rect class="band accs" x="293" y="112" width="14" height="30" rx="3"  stroke-width="1.4"/><rect class="band accs" x="333" y="112" width="14" height="30" rx="3"  stroke-width="1.4"/><text x="320" y="166" class="dim" font-size="10" text-anchor="middle" font-weight="normal">pull-ups</text><line class="edge" x1="300" y1="104" x2="300" y2="150"/><line class="edge" x1="340" y1="104" x2="340" y2="196"/><rect class="panel" x="70" y="248" width="190" height="62" rx="8"/><rect class="band" x="71" y="249" width="188" height="24" rx="7"/><text x="165" y="270" class="t" font-size="12" text-anchor="middle" font-weight="600">Nano 33 IoT</text><text x="165" y="292" class="dim" font-size="10" text-anchor="middle" font-weight="normal">controller · master</text><line class="edge" x1="130" y1="150" x2="130" y2="248"/><line class="edge" x1="200" y1="196" x2="200" y2="248"/><rect class="panel" x="300" y="248" width="190" height="62" rx="8"/><text x="395" y="270" class="t" font-size="12" text-anchor="middle" font-weight="600">Motor Carrier</text><text x="395" y="292" class="dim" font-size="10" text-anchor="middle" font-weight="normal">motors, IMU · slave</text><line class="edge" x1="360" y1="150" x2="360" y2="248"/><line class="edge" x1="430" y1="196" x2="430" y2="248"/><rect class="panel" x="530" y="248" width="190" height="62" rx="8"/><text x="625" y="270" class="t" font-size="12" text-anchor="middle" font-weight="600">Encoders</text><text x="625" y="292" class="dim" font-size="10" text-anchor="middle" font-weight="normal">via carrier · slave</text><line class="edge" x1="590" y1="150" x2="590" y2="248"/><line class="edge" x1="660" y1="196" x2="660" y2="248"/></svg>