<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Bar comparison: 59 tethered tuning trials against 3 untethered validation runs">
<style>
  /* Burgundy + gold, taken verbatim from site/style.css, which in turn follows
     brand/README.md. Light mode leads with the wine red; dark mode leads with
     the gold, because a #5A1322 line is invisible on a near-black field - the
     same split the avatar uses. */
  .bg    { fill: #fbf8f7; }                                    /* --bg */
  .panel { fill: #ffffff; stroke: #e6dcdd; stroke-width: 1.5; }   /* --panel / --line */
  .band  { fill: #f4efee; }                                    /* --accent-soft */
  .edge  { stroke: #8a7d80; stroke-width: 1.5; fill: none; }   /* --ink-3 */
  .dash  { stroke: #8a7d80; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
  .t     { fill: #1a1214; font-family: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif; }
  .m     { fill: #55494c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .dim   { fill: #8a7d80; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .acc   { fill: #5A1322; }                                    /* --accent */
  .accs  { stroke: #5A1322; }
  .ok    { fill: #2f6f4e; }
  .ser1  { stroke: #5A1322; }                                  /* primary series */
  .ser2  { stroke: #8a6718; }                                  /* gold, darkened for cream */
  .grid  { stroke: #e6dcdd; }
  .axis  { stroke: #8a7d80; stroke-width: 1.4; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #120A10; }
    .panel { fill: #1d151a; stroke: #33232a; }
    .band  { fill: #3C0B16; }
    .edge, .dash { stroke: #8a7d82; }
    .t     { fill: #F4EFEE; }
    .m     { fill: #b9aeb1; }
    .dim   { fill: #8a7d82; }
    .acc   { fill: #C9A24A; }
    .accs  { stroke: #C9A24A; }
    .ok    { fill: #74c49a; }
    .ser1  { stroke: #C9A24A; }
    .ser2  { stroke: #d98a80; }
    .grid  { stroke: #33232a; }
    .axis  { stroke: #8a7d82; }
  }
</style>
<rect class="bg" width="820" height="330"/><text x="40" y="36" class="t" font-size="16" text-anchor="start" font-weight="600">Where the iterations went</text><text x="40" y="56" class="dim" font-size="11" text-anchor="start" font-weight="normal">The same controller, sampled at two very different costs per attempt.</text><rect class="panel" x="40" y="110" width="740" height="72" rx="8"/><text x="60" y="136" class="t" font-size="12.5" text-anchor="start" font-weight="600">tethered tuning trials</text><text x="60" y="156" class="dim" font-size="10" text-anchor="start" font-weight="normal">host attached · minutes per attempt</text><rect class="band accs" x="60" y="162" width="560" height="12" rx="6"  stroke-width="1.2"/><text x="634" y="172" class="acc" font-size="14" text-anchor="start" font-weight="600">59</text><rect class="panel" x="40" y="206" width="740" height="72" rx="8"/><text x="60" y="232" class="t" font-size="12.5" text-anchor="start" font-weight="600">untethered validation runs</text><text x="60" y="252" class="dim" font-size="10" text-anchor="start" font-weight="normal">flash, walk the track · far slower</text><rect class="band accs" x="60" y="258" width="28" height="12" rx="6"  stroke-width="1.2"/><text x="102" y="268" class="acc" font-size="14" text-anchor="start" font-weight="600">3</text><rect class="panel" x="40" y="288" width="740" height="30" rx="7"/><text x="60" y="308" class="dim" font-size="11" text-anchor="start" font-weight="normal">The bottleneck was never the control law. It was the cost of one more attempt.</text></svg>