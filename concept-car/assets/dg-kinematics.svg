<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Differential drive kinematics: two wheels with velocities V_l and V_r, wheelbase L, turning about an instantaneous centre of curvature at radius R">
<style>
  /* Burgundy + gold, taken verbatim from site/style.css, which in turn follows
     brand/README.md. Light mode leads with the wine red; dark mode leads with
     the gold, because a #5A1322 line is invisible on a near-black field - the
     same split the avatar uses. */
  .bg    { fill: #fbf8f7; }                                    /* --bg */
  .panel { fill: #ffffff; stroke: #e6dcdd; stroke-width: 1.5; }   /* --panel / --line */
  .band  { fill: #f4efee; }                                    /* --accent-soft */
  .edge  { stroke: #8a7d80; stroke-width: 1.5; fill: none; }   /* --ink-3 */
  .dash  { stroke: #8a7d80; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
  .t     { fill: #1a1214; font-family: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif; }
  .m     { fill: #55494c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .dim   { fill: #8a7d80; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .acc   { fill: #5A1322; }                                    /* --accent */
  .accs  { stroke: #5A1322; }
  .ok    { fill: #2f6f4e; }
  .ser1  { stroke: #5A1322; }                                  /* primary series */
  .ser2  { stroke: #8a6718; }                                  /* gold, darkened for cream */
  .grid  { stroke: #e6dcdd; }
  .axis  { stroke: #8a7d80; stroke-width: 1.4; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #120A10; }
    .panel { fill: #1d151a; stroke: #33232a; }
    .band  { fill: #3C0B16; }
    .edge, .dash { stroke: #8a7d82; }
    .t     { fill: #F4EFEE; }
    .m     { fill: #b9aeb1; }
    .dim   { fill: #8a7d82; }
    .acc   { fill: #C9A24A; }
    .accs  { stroke: #C9A24A; }
    .ok    { fill: #74c49a; }
    .ser1  { stroke: #C9A24A; }
    .ser2  { stroke: #d98a80; }
    .grid  { stroke: #33232a; }
    .axis  { stroke: #8a7d82; }
  }
</style>
<rect class="bg" width="900" height="600"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker></defs><text x="40" y="36" class="t" font-size="16" text-anchor="start" font-weight="600">Differential drive kinematics</text><text x="40" y="56" class="dim" font-size="11" text-anchor="start" font-weight="normal">Two independently driven wheels; body motion follows from the pair.</text><line class="dash" x1="110" y1="300" x2="800" y2="300"/><circle cx="110" cy="300" r="7" class="acc"/><text x="110" y="282" class="acc" font-size="12" text-anchor="middle" font-weight="600">ICC</text><text x="110" y="332" class="dim" font-size="10" text-anchor="middle" font-weight="normal">instantaneous</text><text x="110" y="346" class="dim" font-size="10" text-anchor="middle" font-weight="normal">centre of curvature</text><rect class="panel" x="358" y="242" width="44" height="116" rx="9"/><line class="edge" x1="358" y1="300" x2="402" y2="300"/><text x="380" y="376" class="dim" font-size="11" text-anchor="middle" font-weight="normal">left wheel</text><line class="accs" x1="380" y1="242" x2="380" y2="192" stroke-width="2" marker-end="url(#ar)"/><text x="388" y="208" class="acc" font-size="12" text-anchor="start" font-weight="normal">V_l</text><path class="accs" d="M 328,278 a 24,24 0 0 1 0,44" fill="none" stroke-width="1.8" marker-end="url(#ar)"/><text x="312" y="305" class="acc" font-size="12" text-anchor="middle" font-weight="normal">ω_l</text><rect class="panel" x="598" y="242" width="44" height="116" rx="9"/><line class="edge" x1="598" y1="300" x2="642" y2="300"/><text x="620" y="376" class="dim" font-size="11" text-anchor="middle" font-weight="normal">right wheel</text><line class="accs" x1="620" y1="242" x2="620" y2="192" stroke-width="2" marker-end="url(#ar)"/><text x="628" y="208" class="acc" font-size="12" text-anchor="start" font-weight="normal">V_r</text><path class="accs" d="M 672,278 a 24,24 0 0 0 0,44" fill="none" stroke-width="1.8" marker-end="url(#ar)"/><text x="688" y="305" class="acc" font-size="12" text-anchor="middle" font-weight="normal">ω_r</text><line class="edge" x1="380" y1="300" x2="620" y2="300"/><line class="axis" x1="380" y1="418" x2="500" y2="418"/><line class="axis" x1="500" y1="418" x2="620" y2="418"/><text x="440" y="434" class="m" font-size="11" text-anchor="middle" font-weight="normal">L/2</text><text x="560" y="434" class="m" font-size="11" text-anchor="middle" font-weight="normal">L/2</text><line class="accs" x1="500" y1="300" x2="500" y2="160" stroke-width="2.6" marker-end="url(#ar)"/><text x="510" y="176" class="acc" font-size="12" text-anchor="start" font-weight="600">V — body velocity</text><circle cx="500" cy="300" r="4" class="acc"/><line class="axis" x1="110" y1="472" x2="500" y2="472"/><line class="dash" x1="110" y1="300" x2="110" y2="472"/><line class="dash" x1="500" y1="300" x2="500" y2="472"/><text x="305" y="464" class="m" font-size="11" text-anchor="middle" font-weight="normal">R — turn radius</text><rect class="panel" x="40" y="508" width="820" height="66" rx="8"/><text x="60" y="534" class="m" font-size="12" text-anchor="start" font-weight="normal">V = (V_r + V_l) / 2</text><text x="300" y="534" class="m" font-size="12" text-anchor="start" font-weight="normal">ω = (V_r − V_l) / L</text><text x="560" y="534" class="m" font-size="12" text-anchor="start" font-weight="normal">R = (L/2) · (V_r + V_l) / (V_r − V_l)</text><text x="60" y="558" class="dim" font-size="11" text-anchor="start" font-weight="normal">Straight when V_r = V_l; rotates in place when V_r = −V_l, which is what Turn1 commands.</text></svg>